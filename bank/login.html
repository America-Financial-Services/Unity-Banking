<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Unity Banking || Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {font-family:Arial,sans-serif;background-color:#eef3f7;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
    .login-container{background:#fff;padding:30px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.1);max-width:400px;width:100%;box-sizing:border-box}
    h2{text-align:center;color:#1F1B44;margin-bottom:20px} label{display:block;margin-bottom:8px;font-weight:bold}
    .input-wrap{position:relative;margin-bottom:20px}.input-wrap input{width:100%;padding:10px 72px 10px 10px;border-radius:6px;border:1px solid #ccc;box-sizing:border-box}
    .toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#1F1B44;cursor:pointer;font-weight:700}
    button[type=submit]{width:100%;padding:12px;background-color:#1F1B44;color:#fff;border:0;border-radius:6px;cursor:pointer;font-size:16px}
    button[type=submit]:hover{background-color:#151136}.error-message{color:#b00020;text-align:center;margin-bottom:15px;display:none}
  </style>
</head>
<body>
<div class="login-container">
  <h2>Unity Banking Login</h2>
  <div class="error-message" id="error">Invalid username or password</div>
  <form id="loginForm" autocomplete="off">
    <label for="username">Username</label><div class="input-wrap"><input type="text" id="username" required></div>
    <label for="password">Password</label><div class="input-wrap"><input type="password" id="password" required><button type="button" class="toggle" data-target="password">Show</button></div>
    <button type="submit">Login</button>
  </form>
</div>
<script>
  document.querySelectorAll('.toggle').forEach(btn=>btn.addEventListener('click',()=>{const i=document.getElementById(btn.dataset.target);i.type=i.type==='password'?'text':'password';btn.textContent=i.type==='password'?'Show':'Hide'}));
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const error=document.getElementById('error'); error.style.display='none';
    try {
      const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});
      const data=await response.json(); if(!response.ok) throw new Error(data.message||'Login failed.');
      sessionStorage.setItem('unityToken',data.token); sessionStorage.setItem('authLogin','true'); sessionStorage.setItem('unityUsername',data.username); window.location.href='pin.html';
    } catch(err) { error.textContent=err.message; error.style.display='block'; }
  });
</script>
</body>
</html>
