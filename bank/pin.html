<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PRIVATE WELLS BANK | Enter PIN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef3f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .pin-container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,.1);
      max-width: 350px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }

    h2 {
      color: #1F1B44;
      margin-bottom: 20px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 72px 12px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 18px;
      text-align: center;
      box-sizing: border-box;
    }

    .toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #1F1B44;
      cursor: pointer;
      font-weight: 700;
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #1F1B44;
      color: #fff;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button[type="submit"]:hover {
      background-color: #151136;
    }

    .error-message {
      color: #b00020;
      margin-bottom: 15px;
      display: none;
    }
  </style>
</head>

<body>

<div class="pin-container">

  <h2>Enter Your Security PIN</h2>

  <div class="error-message" id="error">
    Invalid PIN
  </div>

  <form id="pinForm" autocomplete="off">

    <div class="input-wrap">

      <input
        type="password"
        inputmode="numeric"
        id="pin"
        placeholder="Enter PIN"
        maxlength="4"
        pattern="[0-9]{4}"
        required
      />

      <button
        type="button"
        class="toggle"
        id="togglePin"
      >
        Show
      </button>

    </div>

    <button type="submit">
      Continue
    </button>

  </form>

</div>

<script>
  const VALID_PIN = "1991";

  /*
    User must successfully pass login.html first.
  */
  const loginVerified =
    sessionStorage.getItem("authLogin");

  if (loginVerified !== "true") {
    window.location.href = "login.html";
  }

  /*
    Show / Hide PIN
  */
  document
    .getElementById("togglePin")
    .addEventListener("click", function () {

      const pinInput =
        document.getElementById("pin");

      if (pinInput.type === "password") {
        pinInput.type = "text";
        this.textContent = "Hide";
      } else {
        pinInput.type = "password";
        this.textContent = "Show";
      }

    });

  /*
    PIN verification
  */
  document
    .getElementById("pinForm")
    .addEventListener("submit", function (e) {

      e.preventDefault();

      const pin =
        document.getElementById("pin").value.trim();

      const error =
        document.getElementById("error");

      error.style.display = "none";

      if (pin === VALID_PIN) {

        sessionStorage.setItem(
          "pinVerified",
          "true"
        );

        const redirect =
          new URLSearchParams(
            window.location.search
          ).get("redirect");

        window.location.href =
          redirect || "dashboard.html";

      } else {

        error.textContent =
          "Invalid PIN";

        error.style.display =
          "block";

        document.getElementById("pin").value = "";
        document.getElementById("pin").focus();

      }
    });
</script>

</body>
</html>
