<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><title>Unity Banking | Enter PIN</title><meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:Arial,sans-serif;background-color:#eef3f7;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.pin-container{background:#fff;padding:30px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.1);max-width:350px;width:100%;text-align:center;box-sizing:border-box}h2{color:#1F1B44;margin-bottom:20px}.input-wrap{position:relative;margin-bottom:20px}.input-wrap input{width:100%;padding:12px 72px 12px 12px;border-radius:6px;border:1px solid #ccc;font-size:18px;text-align:center;box-sizing:border-box}.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#1F1B44;cursor:pointer;font-weight:700}button[type=submit]{width:100%;padding:12px;background-color:#1F1B44;color:#fff;border:0;border-radius:6px;cursor:pointer;font-size:16px}.error-message{color:#b00020;margin-bottom:15px;display:none}
  </style>
</head>
<body>
<div class="pin-container"><h2>Enter Your Security PIN</h2><div class="error-message" id="error">Invalid PIN</div><form id="pinForm" autocomplete="off"><div class="input-wrap"><input type="password" inputmode="numeric" id="pin" placeholder="Enter PIN" maxlength="6" required /><button type="button" class="toggle" id="togglePin">Show</button></div><button type="submit">Submit</button></form></div>
<script>
  const token=sessionStorage.getItem('unityToken'); if(!token) window.location.href='login.html';
  document.getElementById('togglePin').addEventListener('click',function(){const i=document.getElementById('pin');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'Show':'Hide'});
  document.getElementById('pinForm').addEventListener('submit',async(e)=>{e.preventDefault();const error=document.getElementById('error');error.style.display='none';try{const response=await fetch('/api/auth/verify-pin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({pin:document.getElementById('pin').value.trim()})});const data=await response.json();if(!response.ok)throw new Error(data.message||'Invalid PIN.');sessionStorage.setItem('pinVerified','true');const redirect=new URLSearchParams(location.search).get('redirect');window.location.href=redirect||'dashboard.html'}catch(err){error.textContent=err.message;error.style.display='block'}});
</script>
</body>
</html>
